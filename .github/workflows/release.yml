name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.2)'
        required: true
        type: string
      publish_profile:
        description: 'Publish profile to use'
        required: true
        type: choice
        options:
          - ReleaseNoReflectionPublish-O1
          - ReleaseNoReflectionPublish-O2
          - ReleasePublish-O1
          - ReleasePublish-O2
          - DebugPublish
          - DebugNoReflectionPublish
        default: ReleaseNoReflectionPublish-O1

permissions:
  id-token: write
  contents: write
  attestations: write
  pull-requests: write

jobs:
  update_repo_version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Bump Version in .csproj
        run: |
          sed -i -E "s/<Version>.*<\/Version>/<Version>${{ inputs.version }}<\/Version>/" Hi3Helper.Plugin.StellaSora/Hi3Helper.Plugin.StellaSora.csproj

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || (git commit -m "chore(release): bump version to ${{ inputs.version }} [skip ci]" && git push)

  release:
    needs: update_repo_version
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          ref: ${{ github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Hi3Helper.Plugin.StellaSora.sln

      - name: Build solution
        run: dotnet build --configuration Release Hi3Helper.Plugin.StellaSora.sln --no-restore /p:Version=${{ inputs.version }}

      - name: Publish with selected profile
        run: dotnet publish Hi3Helper.Plugin.StellaSora/Hi3Helper.Plugin.StellaSora.csproj --configuration Release --runtime win-x64 /p:PublishProfile=${{ inputs.publish_profile }} /p:Version=${{ inputs.version }} -o ./publish_output

      - name: Generate build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: './publish_output/**'

      # --- STEP 1: Zip Clean Files (Before Indexer runs) ---
      - name: Create Clean Release Zip
        run: Compress-Archive -Path ./publish_output/* -DestinationPath ./StellaSora_v${{ inputs.version }}.zip

      # --- STEP 2: Indexer (generates .br files and Launcher zip inside ./publish_output) ---
      - name: Run Indexer
        run: .\Indexer.exe .\publish_output

      # --- STEP 3: Generate Changelog ---
      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ inputs.version }} --strip header
        id: git-cliff

      # --- STEP 4: Create GitHub Release ---
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          body: ${{ steps.git-cliff.outputs.content }}
          files: ./publish_output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          repository: misaka10843/CollapsePlugin-ReleaseRepo
          path: ./target-repo
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Copy files to target repo
        run: |
          New-Item -ItemType Directory -Force -Path ./target-repo/StellaSora/build
          New-Item -ItemType Directory -Force -Path ./target-repo/StellaSora/Lib
          Copy-Item -Path ./publish_output/*.dll -Destination ./target-repo/StellaSora/ -ErrorAction SilentlyContinue
          Copy-Item -Path ./publish_output/*.pdb -Destination ./target-repo/StellaSora/ -ErrorAction SilentlyContinue
          Copy-Item -Path ./publish_output/manifest.json -Destination ./target-repo/StellaSora/ -ErrorAction SilentlyContinue
          Copy-Item -Path "./publish_output/Lib/*" -Destination "./target-repo/StellaSora/Lib/" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path ./publish_output/*.zip -Destination ./target-repo/StellaSora/build/

      - name: Create Pull Request in Release Repo
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          path: ./target-repo
          branch: StellaSora-plugin-release-${{ inputs.version }}
          base: main
          title: 'Release StellaSora Plugin v${{ inputs.version }}'
          body: |
            Automated release of StellaSora Plugin v${{ inputs.version }}

            ${{ steps.git-cliff.outputs.content }}

            Files updated:
            - StellaSora.dll
            - StellaSora.pdb
            - manifest.json
            - Lib/*
            - build/*.zip
          commit-message: 'Release StellaSora Plugin v${{ inputs.version }}'
          delete-branch: false
